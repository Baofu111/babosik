<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бабосік · Вхід — помилка</title>
<link rel="stylesheet" href="../../ui/kit.css">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>
</head>
<body>
<div class="auth">

  <section class="auth-hero" aria-label="Про Бабосік">
    <div class="rings" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="sun" aria-hidden="true"></div>
    <div class="a-brand"><span class="mark" aria-hidden="true"></span><b>Бабосік</b></div>
    <h1>Повна картина твоїх витрат</h1>
    <p class="lead">Без рутини. Банк заповнює її сам — ти лише дивишся, куди пішли гроші.</p>
    <div class="trust">
      <span><iconify-icon icon="solar:shield-check-bold"></iconify-icon>Дані під захистом</span>
      <span><iconify-icon icon="solar:card-2-bold"></iconify-icon>Monobank · ПриватБанк</span>
    </div>
  </section>

  <section class="auth-form" aria-label="Вхід">
    <div class="inner">
      <div class="statebox" style="margin:0" role="alert">
        <div class="ic err"><iconify-icon icon="solar:danger-triangle-bold"></iconify-icon></div>
        <h2>Не вдалося увійти</h2>
        <p>Вхід не завершився: акаунт Google не підтвердив доступ або перервалося з'єднання. Дані не втрачено — спробуй ще раз.</p>
        <div class="state-actions"><a class="btn btn-primary" href="signin.html"><iconify-icon icon="solar:refresh-linear"></iconify-icon>Спробувати ще</a></div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
