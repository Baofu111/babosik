name: Deploy Research to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - "research/**"
      - "scripts/build_research.py"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild research.html from research.md
        run: python scripts/build_research.py

      - name: Commit updated HTML (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/research.html
          git diff --staged --quiet || git commit -m "chore: auto-rebuild research.html [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: research

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
