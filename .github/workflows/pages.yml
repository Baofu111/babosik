# Публікацію робить вбудований Pages-білд із гілки master (Settings → Pages →
# «Deploy from a branch», master / root). Він віддає ВЕСЬ репозиторій, тож
# сторінки живуть за /babosik/research/*.html — як і всі посилання в репо.
#
# Цей workflow лише перезбирає research.html з research.md і комітить його.
# Коміт [skip ci] тригерить легасі Pages-білд, який і публікує зміни.
# НЕ додавати сюди actions/deploy-pages — воно конфліктує з легасі-білдом
# (гонка «in progress deployment» → сайт падає в 404).

name: Rebuild research.html

on:
  push:
    branches: [master, main]
    paths:
      - "research/research.md"
      - "scripts/build_research.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild research.html from research.md
        run: python scripts/build_research.py

      - name: Commit updated HTML (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/research.html
          git diff --staged --quiet || git commit -m "chore: auto-rebuild research.html [skip ci]"
          git push
